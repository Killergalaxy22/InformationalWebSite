<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семантический поиск в браузере</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
        }
        .status {
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        .suggestions {
            margin: 10px 0;
        }
        .suggestions button {
            padding: 5px 10px;
            margin-right: 5px;
            font-size: 0.9em;
            background: #e1e1e1;
            border: none;
            border-radius: 3px;
        }
        .results {
            margin-top: 20px;
        }
        .result-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .score {
            font-weight: bold;
            color: #0066cc;
        }
    </style>
<script src="/header-loader.js" defer></script>
</head>
<body>\n    <div id="header-placeholder"></div>

    <h1>Семантический поиск</h1>
    
    <div id="status" class="status">Загрузка библиотеки...</div>

    <div class="container">
        <h3>Исходный текст (каждое предложение — отдельный документ):</h3>
        <textarea id="documents">
Солнечная система состоит из Солнца и объектов, вращающихся вокруг него.
Быстрая коричневая лиса прыгает через ленивую собаку.
Чтобы испечь шоколадный торт, вам понадобятся мука, сахар, какао-порошок и яйца.
Искусственный интеллект и машинное обучение трансформируют современные технологии.
Столица Франции — Париж, известный своим искусством, модой и гастрономией.
Python — популярный язык программирования, используемый для науки о данных и веб-разработки.
Ежедневный бег улучшает здоровье сердечно-сосудистой системы и повышает уровень энергии.
        </textarea>

        <div class="search-box">
            <input type="text" id="query" placeholder="Введите поисковый запрос..." disabled>
            <button id="search-btn" disabled>Искать</button>
        </div>

        <div class="suggestions">
            <strong>Тестовые запросы:</strong>
            <button onclick="setQuery('рецепт десерта')">рецепт десерта</button>
            <button onclick="setQuery('астрономия и космос')">астрономия и космос</button>
            <button onclick="setQuery('написание кода')">написание кода</button>
            <button onclick="setQuery('фитнес и здоровье')">фитнес и здоровье</button>
        </div>

        <div id="qa-result" class="status" style="display: none; background-color: #e6f2ff; border-left: 4px solid #0066cc;"></div>

        <div class="results" id="results"></div>
    </div>

    <!-- Подключение Transformers.js версии 2 через CDN -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // Отключаем локальные пути, загружаем модели из репозитория Hugging Face
        env.allowLocalModels = false;

        const statusDiv = document.getElementById('status');
        const queryInput = document.getElementById('query');
        const searchBtn = document.getElementById('search-btn');
        const documentsArea = document.getElementById('documents');
        const resultsDiv = document.getElementById('results');
        const qaResultDiv = document.getElementById('qa-result');

        let extractor;
        let qaPipeline;
        let documentEmbeddings = [];
        let documents = [];

        // Функция вычисления косинусного сходства
        function cosineSimilarity(arg1, arg2) {
            let dotProduct = 0;
            let normA = 0;
            let normB = 0;
            for (let i = 0; i < arg1.length; i++) {
                dotProduct += arg1[i] * arg2[i];
                normA += arg1[i] * arg1[i];
                normB += arg2[i] * arg2[i];
            }
            return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
        }

        async function init() {
            try {
                statusDiv.innerText = 'Загрузка моделей (эмбеддинги ~118 МБ, QA ~150 МБ)...';
                // Инициализируем пайплайн с мультиязычной моделью, отлично понимающей русский
                extractor = await pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2');
                // Используем специально сконвертированную для браузера мультиязычную QA-модель
                qaPipeline = await pipeline('question-answering', 'onnx-community/xlm-roberta-base-squad2-distilled-ONNX');
                statusDiv.innerText = 'Модели загружены. Индексация документов...';
                
                await indexDocuments();
                
                statusDiv.innerText = 'Готово к поиску.';
                queryInput.disabled = false;
                searchBtn.disabled = false;
            } catch (error) {
                statusDiv.innerText = 'Ошибка инициализации: ' + error.message;
                console.error(error);
            }
        }

        async function indexDocuments() {
            const article = document.querySelector('body > div.container > main > article');
            let rawText = '';

            if (article) {
                // Оптимизированный нативный парсинг: клонируем узел для безопасной работы с DOM
                const clone = article.cloneNode(true);
                const blockTags = ['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li', 'blockquote', 'div', 'section', 'article', 'aside', 'header', 'footer', 'figcaption', 'tr', 'ul', 'ol', 'dl', 'dt', 'dd'];
                
                // Очищаем текст от невидимых элементов
                clone.querySelectorAll('script, style, noscript').forEach(el => el.remove());
                
                // Разделяем блочные элементы переносами строк (закрытие тега = конец документа)
                clone.querySelectorAll(blockTags.join(',')).forEach(el => {
                    el.insertAdjacentText('beforebegin', '\n');
                    el.insertAdjacentText('afterend', '\n');
                });
                clone.querySelectorAll('br').forEach(el => el.insertAdjacentText('afterend', '\n'));
                
                rawText = clone.textContent;
            } else if (documentsArea) {
                // Фолбэк на случай, если структура main > article еще не добавлена на страницу
                rawText = documentsArea.value;
            }

            documents = rawText
                .split(/\n+/)
                .map(doc => doc.replace(/\s+/g, ' ').trim())
                .filter(doc => doc.length >= 10 && /\p{L}/u.test(doc));
                
            documentEmbeddings = [];
            
            for (const doc of documents) {
                const output = await extractor(doc, { pooling: 'mean', normalize: true });
                documentEmbeddings.push(Array.from(output.data));
            }
        }

        async function performSearch() {
            const query = queryInput.value.trim();
            if (!query) return;

            statusDiv.innerText = 'Поиск...';
            
            // Если текст был изменен, переиндексируем
            await indexDocuments();

            const queryOutput = await extractor(query, { pooling: 'mean', normalize: true });
            const queryEmbedding = Array.from(queryOutput.data);

            const scores = documents.map((doc, idx) => {
                const similarity = cosineSimilarity(queryEmbedding, documentEmbeddings[idx]);
                return { doc, score: similarity };
            });

            // Сортировка по убыванию сходства
            scores.sort((a, b) => b.score - a.score);

            // Извлечение точного ответа из наиболее релевантного документа
            if (scores.length > 0) {
                qaResultDiv.style.display = 'block';
                qaResultDiv.innerHTML = '<em>Извлечение точного ответа...</em>';
                
                // Оптимизация: передаем в QA-модель только лучший найденный контекст
                const bestContext = scores[0].doc;
                const qaResult = await qaPipeline(query, bestContext);
                
                // Вырезаем ответ напрямую из исходного текста по индексам, 
                // чтобы избежать бага токенизатора с потерей пробелов
                const exactAnswer = bestContext.substring(qaResult.start, qaResult.end) || qaResult.answer;
                
                qaResultDiv.innerHTML = `<strong>Точный ответ:</strong> ${exactAnswer} <br><small>(Уверенность: ${(qaResult.score * 100).toFixed(1)}%)</small>`;
            } else {
                qaResultDiv.style.display = 'none';
            }

            resultsDiv.innerHTML = '<h3>Результаты поиска:</h3>';
            scores.forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `<span class="score">[Сходство: ${(item.score * 100).toFixed(1)}%]</span> ${item.doc}`;
                resultsDiv.appendChild(div);
            });

            statusDiv.innerText = 'Готово к поиску.';
        }

        searchBtn.addEventListener('click', performSearch);
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        window.setQuery = function(text) {
            queryInput.value = text;
            performSearch();
        }

        init();
    </script>
</body>
</html>
